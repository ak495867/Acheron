[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acheron-terminal"
version = "1.0.0"
description = "A small, living view of your system in the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ak495867" }]
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
acheron = "acheron:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["acheron"]
